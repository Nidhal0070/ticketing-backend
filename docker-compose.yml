services:
  mongo:
    image: mongo:6
    container_name: mongo_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    networks:
      - ticket-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build: .
    container_name: backend_app
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - MONGO_URI=mongodb://mongo:27017/ticketing
      - GROQ_API_KEY=${GROQ_API_KEY}
      - BACKEND_URL=http://backend:3000
      - JWT_SECRET=super_secret_key_2024
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - ticket-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    read_only: true
    tmpfs:
      - /tmp

networks:
  ticket-net:
    external: true
    name: ticket-net

volumes:
  mongo_data: